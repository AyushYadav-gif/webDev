<!DOCTYPE html>
<html>
<head>
<style> 
body{
    margin:18px;
}
div {
  width: 500px;
  height: 300px;
  background: green;
  transition-property: width;
  transition-duration: 10s;
  
}

#div{transition-timing-function: ease;}

div:hover {
  width: 100px;
  height: 200px;
  background:#667eea;
  border: solid black;
  border-radius: 10%;
  border-style: outset;
  border-color: aqua;
  transform: rotate(180deg);
  translate: 10px;

  
}
</style>
</head>
<body>


<div>DIV</div>

</body>
</html>
