<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*element selector*/
       p      { color: green!important;
                /* border:1px solid black */
    }
   
        .box {
  width: 200px;
  height: 100px;
  border:1px solid black ;
  padding: 20px;
  margin: 40px;
  box-sizing: border-box;

}
    

      /*id selector*/
       #intro { color: blue; }

       /*class selector*/
      .note  { color: orange; }

      
    </style>
</head>
<body>
    <h1 class="box">this is my heading
    </h1>
     <p id="intro" class="note">Hello CSS!</p>
